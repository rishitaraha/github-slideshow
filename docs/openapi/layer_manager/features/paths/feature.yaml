get:
  operationId: retrieve_feature
  description: "Get detail of a feature."
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../../shared/schemas/response_metadata_get.yaml"
              data:
                $ref: "../schemas/response/get_feature.yaml"
      description: ""
  tags:
    - features

patch:
  operationId: partial_update_feature
  description: "Update  a feature."
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/request/update_feature.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/request/update_feature.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/request/update_feature.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../../shared/schemas/response_metadata_patch.yaml"
              data:
                $ref: "../schemas/response/update_feature.yaml"
      description: ""
  tags:
    - features
