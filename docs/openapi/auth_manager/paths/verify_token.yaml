post:
  operationId: create_verify_token
  description: "Validates the access-token passed in request body."
  parameters: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/params/verify_token.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/params/verify_token.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/params/verify_token.yaml"

  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token is valid."
      description: ""
  tags:
    - auth
