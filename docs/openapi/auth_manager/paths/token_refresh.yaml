post:
  operationId: create_token_refresh
  description: "Creates and returns a new jwt access-token.
    If the refresh token passed in request body is valid."
  parameters: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/params/token_refresh.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/params/token_refresh.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/params/token_refresh.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                $ref: "../schemas/response/token_refresh.yaml"
      description: ""
  tags:
    - auth
