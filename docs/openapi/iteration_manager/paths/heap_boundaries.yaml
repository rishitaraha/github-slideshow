get:
  operationId: list_heap-boundarys
  description: "Returns list of heap-boundarys."
  parameters:
    $ref: "../../shared/parameters/search.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                type: array
                items:
                  $ref: "../schemas/heap-boundary.yaml"
      description: ""
  tags:
    - heap-boundary
post:
  operationId: create_heap-boundary
  description: "Create a new heap-boundary."
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
  responses:
    "201":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_post.yaml"
              data:
                $ref: "../schemas/heap-boundary.yaml"
      description: ""
  tags:
    - heap-boundary
