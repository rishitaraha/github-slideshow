get:
  operationId: retrieve_heap-boundary
  description: "Get details of an heap-boundary."
  parameters:
    $ref: "../../shared/parameters/search.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                $ref: "../schemas/heap-boundary.yaml"
      description: ""
  tags:
    - heap-boundary
patch:
  operationId: partial_update_heap-boundary
  description: "Update few details of an heap-boundary."
  parameters:
   $ref: "../../shared/parameters/search.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/heap-boundary.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_patch.yaml"
              data:
                $ref: "../schemas/heap-boundary.yaml"
      description: ""
  tags:
    - heap-boundary
delete:
  operationId: destroy_heap-boundary
  description: "Delete an heap-boundary object."
  parameters:
    - name: id
      in: path
      required: true
      description: A UUID string identifying this heap-boundary.
      schema:
        type: string
  responses:
    "204":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_delete.yaml"
              data:
                type: object
      description: "No Content"
  tags:
    - heap-boundary
