get:
  operationId: retrieve_iteration
  description: "Get details of an iteration."
  parameters:
    - $ref: "../../shared/parameters/search.yaml"
    - iteration_dataset:
      description: A boolean parameter to include iteration_dataset in response
      schema:
        type: boolean
        default: false

  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                $ref: "../schemas/response/get_iteration.yaml"
      description: ""
  tags:
    - iterations
patch:
  operationId: partial_update_iteration
  description: "Update few details of an iteration."
  parameters:
    $ref: "../../shared/parameters/search.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/request/patch_iteration.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/request/patch_iteration.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/request/patch_iteration.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_patch.yaml"
              data:
                $ref: "../schemas/response/update_iteration.yaml"
      description: ""
  tags:
    - iterations
delete:
  operationId: destroy_iteration
  description: "Delete an iteration object."
  parameters:
    - name: id
      in: path
      required: true
      description: A UUID string identifying this iteration.
      schema:
        type: string
  responses:
    "204":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_delete.yaml"
              data:
                type: object
      description: "No Content"
  tags:
    - iterations
