get:
  operationId: list_iterations
  description: "Returns list of iterations."
  parameters:
    $ref: "../../shared/parameters/search.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                type: object
                properties:
                  iterations:
                    type: array
                    items:
                      $ref: "../schemas/response/get_iteration.yaml"
                  can_manage_iterations:
                    type: boolean
                  total:
                    type: number
                  site:
                    type: string
      description: ""
  tags:
    - iterations
post:
  operationId: create_iteration
  description: "Create a new iteration."
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/request/iteration.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/request/iteration.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/request/iteration.yaml"
  responses:
    "201":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_post.yaml"
              data:
                $ref: "../schemas/response/create_iteration.yaml"
      description: ""
  tags:
    - iterations
