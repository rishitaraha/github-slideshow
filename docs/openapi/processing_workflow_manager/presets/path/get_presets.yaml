get:
  summary: Get list of Default and Org Presets.
  parameters:
    - in: query
      name: id
      required: true
      description: UUID of parent dataset
      schema:
        type: string
        format: uuid

  responses:
    "200":
      description: List of Default and Org Presets.
      content:
        application/json:
          schema:
            type: object
            properties:
              presets:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                    org:
                      type: string
                      format: uuid
                      nullable: true
  tags:
    - processing_workflow
