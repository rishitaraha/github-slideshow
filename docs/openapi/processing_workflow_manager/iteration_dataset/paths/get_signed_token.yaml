get:
  summary: Get signed token for input dataset download.
  parameters:
    - in: query
      name: id
      required: true
      description: UUID of the iteration dataset.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Signed token for iteration dataset download.
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
                description: The signed token for dataset download.

tags:
  - processing_workflow
