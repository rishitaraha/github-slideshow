type: object
properties:
  project:
    type: object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        maxLength: 255
  terrain_site:
    type: object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        maxLength: 100
  terrain_iteration:
    type: object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        maxLength: 200
      date:
        type: string
        format: date
      captured_dsm:
        type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          status:
            type: string
      captured_dsm_cog:
        type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          s3_key:
            type: string
            format: url
          status:
            type: string
      terrain_tiles:
        type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          path:
            type: string
          status:
            type: string
  selected_site:
    type: object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        maxLength: 100
      latitude:
        type: number
      longitude:
        type: number
      canManageIterationsAndLayers:
        type: boolean
  selected_iteration:
    type: object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
      captured_dsm:
        type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          status:
            type: string
      captured_dsm_cog:
        type: object
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
          status:
            type: string
          batch_job:
            type: object
            properties:
              path:
                type: string
              status:
                type: string
          created_at:
            type: string
            format: date-time
            readOnly: true
  camera:
    $ref: "../camera.yaml"
  workspace_layers:
    $ref: "./get_workspace_layers.yaml"
