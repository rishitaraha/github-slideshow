get:
  operationId: list_project
  description: "Returns list of projects."
  parameters:
    $ref: "../../shared/parameters/search.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_get.yaml"
              data:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "../schemas/list_project.yaml"
                  total:
                    type: number
      description: ""
  tags:
    - projects
post:
  operationId: create_project
  description: "Create a new project."
  parameters: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/project.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/project.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/project.yaml"
  responses:
    "201":
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: "../../shared/schemas/response_metadata_post.yaml"
              data:
                $ref: "../schemas/project.yaml"
      description: ""
  tags:
    - projects
