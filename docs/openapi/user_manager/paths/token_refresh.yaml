post:
  operationId: create_token_refresh
  description:
    "Takes a refresh type JSON web token and returns an access type
    JSON web

    token if the refresh token is valid."
  parameters: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/token_refresh.yaml"
      application/x-www-form-urlencoded:
        schema:
          $ref: "../schemas/token_refresh.yaml"
      multipart/form-data:
        schema:
          $ref: "../schemas/token_refresh.yaml"
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schemas/token_refresh.yaml"
      description: ""
  tags:
    - users
