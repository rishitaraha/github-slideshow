{% load static %}
<html>
  <head>
    <title>Rainbow API Documentation</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="//unpkg.com/swagger-ui-dist@5.10.5/index.css"
    />
    <link
      rel="icon"
      type="image/png"
      href="//unpkg.com/swagger-ui-dist@5.10.5/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="//unpkg.com/swagger-ui-dist@5.10.5/favicon-16x16.png"
      sizes="16x16"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script
      src="//unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"
      charset="UTF-8"
    ></script>
    <script
      src="//unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-standalone-preset.js"
      charset="UTF-8"
    ></script>

    <script>
      const ui = SwaggerUIBundle({
        url: "{% static 'openapi.yaml' %}",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        filter: true,
        displayRequestDuration: true,
      });
    </script>
  </body>
</html>
